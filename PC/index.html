<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ToneUp 考研刷题 PC 端：题库刷题、智能复习、AI 判分与统计。" />
    <title>ToneUp · 一潼上岸</title>
    <script>
      // H-113：首屏前同步持久化主题，避免闪烁（FOUC）；与 src/main.ts 的读取逻辑保持一致，
      // 迁移表与 src/stores/ui.ts THEME_KEY_MIGRATIONS 同步维护。
      ;(function () {
        try {
          var raw = localStorage.getItem('toneup:ui')
          if (!raw) return
          var saved = JSON.parse(raw)
          var migrations = { 'deep-ocean': 'sky-blue', 'morandi-green': 'firefly' }
          var theme = saved && saved.colorTheme
          if (theme && Object.prototype.hasOwnProperty.call(migrations, theme)) theme = migrations[theme]
          if (theme) document.documentElement.dataset.theme = theme
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
