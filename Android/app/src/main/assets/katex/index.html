<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<style>
  :root { --fg: #1B1F2E; --code-bg: rgba(0,0,0,0.06); }
  body.dark { --fg: #E4E6EF; --code-bg: rgba(255,255,255,0.12); }
  html, body {
    margin: 0; padding: 0;
    background: transparent !important;
    color: var(--fg);
    -webkit-text-size-adjust: 100%;
    word-break: break-word;
  }
  #content { padding: 2px 4px; font-size: 16px; line-height: 1.65; }
  p { margin: 0.35em 0; }
  code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.92em;
  }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  b, strong { font-weight: 600; }
</style>
</head>
<body>
<div id="content"></div>
<script>
  var lastHeight = 0;

  // ── HTML 白名单消毒（C-1）───────────────────────────────────────────
  // 题目内容经 markdown 转 HTML 后可能携带不可信标记；innerHTML 直接注入
  // 会在 WebView 内执行事件属性/危险标签并触达 JS bridge。此处用
  // DOMParser 做白名单过滤：剥离事件属性、javascript: URL、script/svg 等
  // 危险标签（含其子树），未知标签剥壳保留文本。
  var ALLOWED_TAGS = {
    p: 1, br: 1, hr: 1, b: 1, strong: 1, i: 1, em: 1, u: 1, s: 1,
    code: 1, pre: 1, span: 1, div: 1, blockquote: 1,
    ul: 1, ol: 1, li: 1, h1: 1, h2: 1, h3: 1, h4: 1, h5: 1, h6: 1,
    table: 1, thead: 1, tbody: 1, tfoot: 1, tr: 1, td: 1, th: 1,
    sub: 1, sup: 1, img: 1, a: 1
  };
  var DROP_WITH_SUBTREE = {
    script: 1, style: 1, iframe: 1, object: 1, embed: 1, link: 1,
    meta: 1, base: 1, template: 1, form: 1, svg: 1, math: 1, noscript: 1
  };

  function sanitizeHtml(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var root = document.createElement('div');
    (function walk(src, dst) {
      for (var i = 0; i < src.childNodes.length; i++) {
        var n = src.childNodes[i];
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); continue; }
        if (n.nodeType !== 1) continue;
        var tag = n.tagName.toLowerCase();
        if (DROP_WITH_SUBTREE[tag]) continue;
        if (!ALLOWED_TAGS[tag]) { walk(n, dst); continue; }
        var el = document.createElement(tag);
        if (tag === 'img') {
          var src = n.getAttribute('src') || '';
          if (/^(https?:|data:image\/(png|jpe?g|gif|webp);|\/)/i.test(src)) {
            el.setAttribute('src', src);
          }
          var alt = n.getAttribute('alt');
          if (alt) el.setAttribute('alt', alt);
        } else if (tag === 'a') {
          var href = n.getAttribute('href') || '';
          if (/^https?:/i.test(href)) {
            el.setAttribute('href', href);
            el.setAttribute('rel', 'noopener noreferrer');
          }
        }
        walk(n, el);
        dst.appendChild(el);
      }
    })(doc.body, root);
    return root.innerHTML;
  }

  function postHeight() {
    var el = document.getElementById('content');
    var h = Math.ceil(el.scrollHeight);
    if (h > 0 && h !== lastHeight) {
      lastHeight = h;
      try { window.AndroidBridge.onHeight(h); } catch (e) {}
    }
  }

  // M-5：ResizeObserver 一帧内可能触发多次，直接 postHeight 会反复通知 native
  // 调整 WebView 高度；用 rAF 把同帧多次回调合并为一次上报
  // （postHeight 内部另有 lastHeight 去重，首帧双保险调用保持不变）
  var heightScheduled = false;
  function schedulePostHeight() {
    if (heightScheduled) return;
    heightScheduled = true;
    requestAnimationFrame(function() {
      heightScheduled = false;
      postHeight();
    });
  }

  // M-4：裸 $ 行内定界会把同一文本节点中的两个美元符号误判为公式（如"价格 $5 与税 $1"）。
  // 渲染前对文本节点做严格配对转换：仅当 $ 紧贴非空白内容且不跨行时才转为 \(...\)
  // （与 Pandoc 行内数学约定一致），其余 $ 对按普通文本保留；
  // 下方 delimiters 中不再保留裸 $ 条目，转换后的 \( \) 交给 auto-render 渲染。
  function convertInlineDollar(text) {
    if (text.indexOf('$') === -1) return text;
    var stash = [];
    // 先摘出 display 公式 $$...$$，避免其中的 $ 被行内转换误伤
    var s = text.replace(/\$\$[^$]*\$\$/g, function(m) {
      stash.push(m);
      return '\u0000' + (stash.length - 1) + '\u0000';
    });
    s = s.replace(/\$([^\$\n]+?)\$/g, function(m, inner) {
      return (/^\s|\s$/.test(inner)) ? m : '\\(' + inner + '\\)';
    });
    return s.replace(/\u0000(\d+)\u0000/g, function(m, i) { return stash[+i]; });
  }

  function convertInlineDollarsInTree(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (var i = 0; i < nodes.length; i++) {
      var converted = convertInlineDollar(nodes[i].nodeValue);
      if (converted !== nodes[i].nodeValue) nodes[i].nodeValue = converted;
    }
  }

  function renderContent(html, dark) {
    try {
      document.body.classList.toggle('dark', !!dark);
      var el = document.getElementById('content');
      el.innerHTML = sanitizeHtml(html);
      // M-4：行内公式不再依赖 auto-render 的裸 $ 定界（会误判普通美元文本），
      // 先按严格规则把紧贴的 $...$ 转为 \(...\)，见 convertInlineDollar
      convertInlineDollarsInTree(el);
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      });
      requestAnimationFrame(function() {
        postHeight();
        setTimeout(postHeight, 60);
        try { window.AndroidBridge.onRendered(); } catch (e) {}
      });
    } catch (err) {
      try { window.AndroidBridge.onError(String(err)); } catch (e2) {}
    }
  }

  function setDark(dark) {
    document.body.classList.toggle('dark', !!dark);
    if (lastHeight > 0) postHeight();
  }

  window.addEventListener('load', function() {
    if (typeof ResizeObserver !== 'undefined') {
      // M-5：经 rAF 合并后再上报，避免高频布局抖动反复通知 native
      new ResizeObserver(schedulePostHeight).observe(document.getElementById('content'));
    }
    // M-6：原先此处调用 AndroidBridge.onTemplateReady()，但 native Bridge 只声明了
    // onHeight/onRendered/onError（见 FormulaWebViewPool.Bridge），该调用必然抛错；
    // 模板就绪由 native 侧 onPageFinished 判定，无需 JS 通知，故移除该调用。
  });

  // JS 错误上报（降级链路）
  window.onerror = function(msg) {
    try { window.AndroidBridge.onError(String(msg)); } catch (e) {}
  };
</script>
</body>
</html>
